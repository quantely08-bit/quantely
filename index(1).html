<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUANTELY - Contador de Personas</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    color:white;
    padding:20px 0;
}

.container{
    width:430px;
    max-width:95%;
    background:#111;
    padding:30px;
    border-radius:25px;
    text-align:center;
    border:2px solid #00d9ff;
    box-shadow:
    0 0 20px #00d9ff,
    0 0 40px #7b2cff;
}

.logo{
    width:230px;
    max-width:90%;
    margin-bottom:15px;
    filter:drop-shadow(0 0 10px #00d9ff);
}

h1{
    font-size:25px;
    letter-spacing:3px;
    margin-bottom:10px;
}

.subtitulo{
    color:#00d9ff;
    font-size:18px;
    letter-spacing:2px;
    margin-bottom:20px;
}

#contador{
    font-size:90px;
    font-weight:bold;
    color:#00d9ff;
    text-shadow:
    0 0 10px #00d9ff,
    0 0 30px #7b2cff;
    margin:20px;
}

.panel{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#181818;
    border-radius:15px;
    padding:15px;
    border:1px solid #7b2cff;
}

.titulo-card{
    font-size:16px;
}

.numero{
    font-size:35px;
    color:#00d9ff;
    font-weight:bold;
    margin-top:5px;
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px #00d9ff;
}

.entrada{
    background:linear-gradient(
        90deg,
        #00d9ff,
        #7b2cff
    );
}

.salida{
    background:linear-gradient(
        90deg,
        #7b2cff,
        #00d9ff
    );
}

.reset{
    background:#111;
    border:1px solid #00d9ff;
}

/* BOTON VOLVER A INICIO */

.inicio{
    display:block;
    width:100%;
    padding:15px;
    margin:8px 0;
    border-radius:12px;
    color:white;
    font-size:17px;
    text-decoration:none;
    background:linear-gradient(
        90deg,
        #7b2cff,
        #00d9ff
    );
    transition:.3s;
}

.inicio:hover{
    transform:scale(1.03);
    box-shadow:
    0 0 20px #00d9ff,
    0 0 30px #7b2cff;
}

.estado{
    color:#00ff99;
    margin-top:15px;
}

.fecha{
    color:#aaa;
    margin-top:10px;
}

/* HISTORIAL */

#historial{
    max-height:300px;
    overflow-y:auto;
    padding:10px;
    text-align:center;
}

#historial::-webkit-scrollbar{
    width:8px;
}

#historial::-webkit-scrollbar-track{
    background:#111;
    border-radius:10px;
}

#historial::-webkit-scrollbar-thumb{
    background:#00d9ff;
    border-radius:10px;
}

#historial::-webkit-scrollbar-thumb:hover{
    background:#7b2cff;
}

.registro{
    display:block;
    text-decoration:none;
    color:#00d9ff;
    margin:8px 0;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.registro:hover{
    background:#222;
    box-shadow:0 0 10px #00d9ff;
}

.guardando{
    color:#ffff00;
}

.guardado{
    color:#00ff99;
}

.error{
    color:#ff4444;
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png"
     class="logo"
     alt="Logo QUANTELY">

<h1>
CONTADOR DE PERSONAS
</h1>

<div class="subtitulo">
GENERA · REA · NALIZA
</div>

<div id="contador">
0
</div>

<div class="panel">

<div class="card">

<div class="titulo-card">
Entradas
</div>

<div class="numero"
     id="entradas">
0
</div>

</div>

<div class="card">

<div class="titulo-card">
Salidas
</div>

<div class="numero"
     id="salidas">
0
</div>

</div>

<div class="card">

<div class="titulo-card">
Máximo
</div>

<div class="numero"
     id="maximo">
0
</div>

</div>

<div class="card">

<div class="titulo-card">
Dentro
</div>

<div class="numero"
     id="dentro">
0
</div>

</div>

</div>

<button class="entrada"
        onclick="entrada()">

👤 PERSONA ENTRÓ

</button>

<button class="salida"
        onclick="salida()">

🚪 PERSONA SALIÓ

</button>

<button class="reset"
        onclick="reiniciar()">

🔄 REINICIAR CONTADOR

</button>

<!-- VOLVER A LA PAGINA DE INICIO -->

<a href="./index.html" class="inicio">

🏠 VOLVER A INICIO

</a>

<div class="estado"
     id="estado">

🔄 Conectando con MQTT...

</div>

<div class="fecha"
     id="fecha">

Cargando fecha...

</div>

<div class="card"
     style="margin-top:20px;">

<h3 style="color:#00d9ff;">

HISTORIAL

</h3>

<div id="historial">

Sin movimientos registrados

</div>

</div>

</div>

<script>

/* =========================================
   MQTT
========================================= */

const MQTT_URL =
"wss://broker.hivemq.com:8884/mqtt";

const TOPIC =
"javier/dato";


/* =========================================
   VARIABLES
========================================= */

let personas = 0;

let entradas = 0;

let salidas = 0;

let maximo = 0;


/* =========================================
   CONECTAR MQTT
========================================= */

const cliente = mqtt.connect(
    MQTT_URL,
    {
        clientId:
        "QUANTELY_" +
        Math.random()
        .toString(16)
        .substring(2,10),

        clean:true,

        reconnectPeriod:3000
    }
);


/* =========================================
   CONECTADO
========================================= */

cliente.on(
    "connect",
    function(){

        document.getElementById(
            "estado"
        ).innerHTML =
        "🟢 MQTT conectado";

        cliente.subscribe(
            TOPIC,
            function(error){

                if(error){

                    console.log(
                        "Error:",
                        error
                    );

                }

                else{

                    console.log(
                        "Suscrito a:",
                        TOPIC
                    );

                }

            }
        );

    }
);


/* =========================================
   DESCONECTADO
========================================= */

cliente.on(
    "offline",
    function(){

        document.getElementById(
            "estado"
        ).innerHTML =
        "🔴 MQTT desconectado";

    }
);


/* =========================================
   RECONEXION
========================================= */

cliente.on(
    "reconnect",
    function(){

        document.getElementById(
            "estado"
        ).innerHTML =
        "🟡 Reconectando MQTT...";

    }
);


/* =========================================
   ERROR
========================================= */

cliente.on(
    "error",
    function(error){

        console.log(
            "Error MQTT:",
            error
        );

    }
);


/* =========================================
   RECIBIR MQTT
========================================= */

cliente.on(
    "message",
    function(topic,message){

        let dato =
        message
        .toString()
        .trim();

        console.log(
            "MQTT recibió:",
            dato
        );

        let nuevoNumero =
        Number(dato);


        /* ENTRADA */

        if(nuevoNumero === 1){

            personas++;

            entradas++;

            if(personas > maximo){

                maximo = personas;

            }

            actualizar();

            crearRegistro(
                "🟢",
                "ENTRADA MQTT",
                1
            );

            document.getElementById(
                "estado"
            ).innerHTML =
            "🟢 Entrada detectada por MQTT";

        }


        /* SALIDA */

        else if(nuevoNumero === -1){

            if(personas > 0){

                personas--;

                salidas++;

                actualizar();

                crearRegistro(
                    "🔵",
                    "SALIDA MQTT",
                    -1
                );

                document.getElementById(
                    "estado"
                ).innerHTML =
                "🔵 Salida detectada por MQTT";

            }

            else{

                document.getElementById(
                    "estado"
                ).innerHTML =
                "⚠️ No hay personas dentro";

            }

        }

    }
);


/* =========================================
   ACTUALIZAR CONTADOR
========================================= */

function actualizar(){

    document.getElementById(
        "contador"
    ).innerHTML =
    personas;

    document.getElementById(
        "dentro"
    ).innerHTML =
    personas;

    document.getElementById(
        "entradas"
    ).innerHTML =
    entradas;

    document.getElementById(
        "salidas"
    ).innerHTML =
    salidas;

    document.getElementById(
        "maximo"
    ).innerHTML =
    maximo;

}


/* =========================================
   HORA
========================================= */

function hora(){

    let fecha =
    new Date();

    return fecha.toLocaleString(
        "es-CO"
    );

}


/* =========================================
   CREAR REGISTRO
========================================= */

function crearRegistro(
    icono,
    movimiento,
    valor
){

    let caja =
    document.getElementById(
        "historial"
    );

    if(
        caja.innerHTML ===
        "Sin movimientos registrados"
    ){

        caja.innerHTML = "";

    }

    let fecha = hora();

    let registro =
    document.createElement(
        "div"
    );

    registro.className =
    "registro guardado";

    registro.innerHTML =

    icono +
    " " +
    movimiento +
    " - " +
    fecha +
    " - Total: " +
    personas;

    caja.prepend(
        registro
    );

}


/* =========================================
   ENTRADA MANUAL
========================================= */

function entrada(){

    personas++;

    entradas++;

    if(personas > maximo){

        maximo = personas;

    }

    actualizar();

    crearRegistro(
        "👤",
        "ENTRADA MANUAL",
        1
    );

    document.getElementById(
        "estado"
    ).innerHTML =
    "🟢 Entrada manual";

}


/* =========================================
   SALIDA MANUAL
========================================= */

function salida(){

    if(personas > 0){

        personas--;

        salidas++;

        actualizar();

        crearRegistro(
            "🚪",
            "SALIDA MANUAL",
            -1
        );

        document.getElementById(
            "estado"
        ).innerHTML =
        "🔵 Salida manual";

    }

    else{

        document.getElementById(
            "estado"
        ).innerHTML =
        "⚠️ No hay personas dentro";

    }

}


/* =========================================
   REINICIAR
========================================= */

function reiniciar(){

    personas = 0;

    entradas = 0;

    salidas = 0;

    maximo = 0;

    actualizar();

    document.getElementById(
        "estado"
    ).innerHTML =
    "🔄 Contador reiniciado";

    document.getElementById(
        "historial"
    ).innerHTML =
    "Sin movimientos registrados";

}


/* =========================================
   RELOJ
========================================= */

function reloj(){

    document.getElementById(
        "fecha"
    ).innerHTML =
    "🕒 " + hora();

}

setInterval(
    reloj,
    1000
);

reloj();

actualizar();

</script>

</body>

</html>
